  <!-- Signal Connectors -->
  <line x1="220" y1="150" x2="340" y2="170" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4"/>
  <line x1="220" y1="230" x2="340" y2="210" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4"/>
  <line x1="220" y1="310" x2="340" y2="250" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4"/>

  <line x1="560" y1="170" x2="680" y2="150" stroke="#238636" stroke-width="2"/>
  <line x1="560" y1="210" x2="680" y2="230" stroke="#238636" stroke-width="2"/>
