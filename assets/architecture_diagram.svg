    <text x="90" y="179" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">gRPC / Port 8443</text>

    <rect x="15" y="220" width="150" height="65" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="90" y="246" font-family="sans-serif" font-size="11" font-weight="600" fill="#c9d1d9" text-anchor="middle">Banking Core Bridge</text>
    <text x="90" y="264" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">Zero-Trust Node</text>
