    <rect x="15" y="135" width="150" height="65" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="90" y="159" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Pilot Node #02</text>
