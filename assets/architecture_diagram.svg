    <text x="110" y="265" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#d29922" text-anchor="middle">&#128196; Pilot Configuration</text>
    <text x="110" y="283" font-family="monospace" font-size="8" fill="#8b949e" text-anchor="middle">client_onboarding_pilot.txt</text>
